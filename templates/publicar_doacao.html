<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>{% if doacao %}Editar doação{% else %}Publicar doação{% endif %}</title>
  </head>
  <body>
    <form method="POST" enctype="multipart/form-data">
    {% if erro %}
    <p>{{ erro }}</p>
    {% endif %}

      <!-- Campo de Título -->
      <div>
        <label for="titulo">Título:</label>
        <input
          type="text"
          id="titulo"
          name="titulo"
          maxlength="100"
          value="{{ doacao.titulo if doacao }}"
          required
        />
      </div>

      <!-- Campo de Descrição -->
      <div>
        <label for="descricao">Descrição:</label>
        <textarea
          id="descricao"
          name="descricao"
          placeholder="Descreva o item que deseja doar"
          required
        >{{ doacao.descricao if doacao }}</textarea>
      </div>

      <!-- Campo de Categoria -->
      <div>
        <label for="categoria">Categoria:</label>
        <select name="categoria" id="categoria" required>
          <option value="">Selecione uma categoria</option>
          {% for categoria in categorias %}
          <option value="{{ categoria }}" {% if doacao and categoria == doacao.categoria %}selected{% endif %}>{{ categoria }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Campo de Estado de Conservação -->
      <div>
        <label for="estado_conservacao">Estado de Conservação:</label>
        <select name="estado_conservacao" id="estado_conservacao" required>
          <option value="">Selecione o estado de conservação</option>
          {% for estado in estados %}
          <option value="{{ estado }}" {% if doacao and estado == doacao.estado_conservacao %}selected{% endif %}>{{ estado }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Campo de Região -->
      <div>
        <label for="regiao">Região:</label>
        <select name="regiao" id="regiao" required>
          <option value="">Selecione sua região</option>
          {% for regiao in regioes %}
          <option value="{{ regiao }}" {% if doacao and regiao == doacao.regiao %}selected{% endif %}>{{ regiao }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Campo de Ponto de Referência (opcional) -->
      <div>
        <label for="ponto_referencia">Ponto de Referência:</label>
        <input
          type="text"
          id="ponto_referencia"
          name="ponto_referencia"
          maxlength="120"
          placeholder="Opcional, ex.: perto da estação"
          value="{{ doacao.ponto_referencia or '' if doacao }}"

        />
      </div>
      <div>
        <label for="foto">Foto do item:</label>
        {% if doacao and doacao.foto_caminho %}
          <img src="{{ url_for('static', filename=doacao.foto_caminho) }}" alt="Foto da doação" width="150">
        {% endif %}
        <p>Escolha um arquivo só se quiser trocar a foto.</p>
        <input
          type="file"
          id="foto"
          name="foto"
          accept=".jpg, .jpeg, .png"
          {% if not doacao %}required{% endif %}
        />
      </div>

      <p>Não são aceitos remédios, alimentos, itens sexuais, eletrodomésticos e eletrônicos.</p>

      <!-- Botão de Envio -->
      <button type="submit">{% if doacao %}Salvar alterações{% else %}Publicar doação{% endif %}</button>
    </form>
  </body>
</html>
