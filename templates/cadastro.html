<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Criar conta</title>
  </head>
  <body>
    <form action="{{ url_for('cadastro') }}" method="POST">
      {% if erro %}
      <p>{{ erro }}</p>
      {% endif %}
      <!-- Campo de Nome -->
      <div>
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Digite seu nome"
          required
        />
      </div>

      <!-- Campo de E-mail -->
      <div>
        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
        />
      </div>

      <!-- Campo de Senha -->
      <div>
        <label for="senha">Senha:</label>
        <input
          type="password"
          id="senha"
          name="senha"
          minlength="8"
          placeholder="Digite sua senha"
          required
        />
      </div>

      <!-- Campo de Região -->
      <div>
        <label for="regiao">Região:</label>
        <select name="regiao" id="regiao" required>
          <option value="">Selecione sua região</option>
          {% for regiao in regioes %}
          <option value="{{ regiao }}">{{ regiao }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Campo de Telefone -->
      <div>
        <label for="telefone">Telefone:</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          placeholder="(61) 90000-0000"
          required
        />
      </div>

      <!-- Botão de Envio -->
      <button type="submit">Criar conta</button>
    </form>
  </body>
</html>
