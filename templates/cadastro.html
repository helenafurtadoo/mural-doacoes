<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Formulário</title>
</head>
<body>

    <form action="/enviar-dados" method="POST">
        <!-- Campo de Nome -->
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="usuario_nome" placeholder="Digite seu nome" required>
        </div>

        <!-- Campo de E-mail -->
        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="usuario_email" placeholder="seu@email.com" required>
        </div>

        <!-- Campo de Senha -->
        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="usuario_senha" placeholder="Digite sua senha" required>
        </div>

        <!-- Campo de Região -->
        <div>
            <label for="regiao">Região:</label>
            <textarea id="regiao" name="usuario_regiao" rows="4" placeholder="Escreva sua mensagem..."></textarea>
        </div>

        <!-- Campo de Telefone -->
        <div>
            <label for="telefone">Telefone:</label>
            <textarea id="telefone" name="usuario_telefone" rows="4" placeholder="Escreva sua mensagem..."></textarea>
        </div>

        <!-- Botão de Envio -->
        <button type="submit">Enviar</button>
    </form>

</body>
</html>
